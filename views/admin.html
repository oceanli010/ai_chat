<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI聊天室 - 管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>管理后台</h2>
                <div class="user-id" id="sidebarInfo"></div>
            </div>
            <nav class="sidebar-nav">
                <a class="active" onclick="switchTab('dashboard')" id="navDashboard">
                    <span class="icon">📊</span> 仪表盘
                </a>
                <a onclick="switchTab('users')" id="navUsers">
                    <span class="icon">👥</span> 用户管理
                </a>
                <a onclick="switchTab('logs')" id="navLogs">
                    <span class="icon">📋</span> 服务器日志
                </a>
            </nav>
            <div class="sidebar-footer">
                <a onclick="logout()">🚪 退出登录</a>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <h3 id="contentTitle">仪表盘</h3>
            </div>
            <div class="content-body" id="contentBody"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        var currentTab = 'dashboard';
        var currentPage = 1;

        checkAdminAuth();

        function checkAdminAuth() {
            var token = localStorage.getItem('token');
            var role = localStorage.getItem('role');
            if (!token || role !== 'admin') {
                window.location.href = '/login.html';
                return;
            }
            api('GET', '/api/user/profile').then(function(res) {
                if (res.code !== 200 || res.data.role !== 'admin') {
                    localStorage.clear();
                    try { localStorage.setItem('logout', Date.now()); } catch(e) {}
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('sidebarInfo').textContent = '管理员 - ' + (res.data.username || '');
                renderCurrentTab();
            }).catch(function() {
                renderCurrentTab();
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.sidebar-nav a').forEach(function(a) { a.classList.remove('active'); });
            document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            var titles = { dashboard: '仪表盘', users: '用户管理', logs: '服务器日志' };
            document.getElementById('contentTitle').textContent = titles[tab];
            currentPage = 1;
            stopUserAutoRefresh();
            renderCurrentTab();
            if (tab === 'users') {
                setTimeout(startUserAutoRefresh, 500);
            }
        }

        function renderCurrentTab() {
            if (currentTab === 'dashboard') renderDashboard();
            else if (currentTab === 'users') renderUsers();
            else renderLogs();
        }

        async function renderDashboard() {
            var body = document.getElementById('contentBody');
            body.innerHTML = '<p>加载中...</p>';
            try {
                var res = await api('GET', '/api/admin/stats');
                if (res.code === 200) {
                    var d = res.data;
                    body.innerHTML = '' +
                        '<div class="admin-stats">' +
                        '  <div class="stat-card"><div class="stat-number">' + d.registered_users + '</div><div class="stat-label">注册用户数</div></div>' +
                        '  <div class="stat-card"><div class="stat-number">' + d.online_users + '</div><div class="stat-label">在线用户数</div></div>' +
                        '  <div class="stat-card"><div class="stat-number">' + d.total_chats + '</div><div class="stat-label">累计对话数</div></div>' +
                        '</div>';
                }
            } catch (e) {
                body.innerHTML = '<p>加载失败</p>';
            }
        }

        var banPresets = {
            24: '1天',
            168: '7天',
            720: '30天',
            8640: '360天',
            86400: '3600天'
        };

        async function renderUsers() {
            var body = document.getElementById('contentBody');
            body.innerHTML = '' +
                '<div class="search-bar">' +
                '  <select id="searchType"><option value="">全部类型</option><option value="username">用户名</option><option value="email">邮箱</option><option value="id">ID</option></select>' +
                '  <input type="text" id="searchKeyword" placeholder="输入搜索关键词...">' +
                '  <button onclick="searchUsers()">搜索</button>' +
                '  <button onclick="loadAllUsers()" style="background:#888;">列出全部</button>' +
                '</div>' +
                '<div id="usersTable"></div>' +
                '<div id="usersPagination" class="pagination"></div>';
            loadAllUsers();
        }

        async function loadAllUsers(page) {
            page = page || currentPage;
            try {
                var res = await api('GET', '/api/admin/users?page=' + page + '&page_size=15');
                if (res.code === 200) {
                    renderUsersTable(res.data.users);
                    renderPagination('usersPagination', page, Math.ceil(res.data.total / 15), loadAllUsers);
                }
            } catch (e) {}
        }

        async function searchUsers() {
            var keyword = document.getElementById('searchKeyword').value.trim();
            var type = document.getElementById('searchType').value;
            if (!keyword) { loadAllUsers(1); return; }
            try {
                var res = await api('POST', '/api/admin/search', { keyword: keyword, type: type });
                if (res.code === 200) {
                    renderUsersTable(res.data.users);
                    document.getElementById('usersPagination').innerHTML = '';
                }
            } catch (e) {}
        }

        function renderUsersTable(users) {
            var container = document.getElementById('usersTable');
            if (!users || users.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无数据</p></div>';
                return;
            }
            var html = '<table class="data-table"><thead><tr>' +
                '<th>ID</th><th>用户名</th><th>邮箱</th><th>状态</th><th>封禁到期</th><th>封禁理由</th><th>对话数</th><th>操作</th></tr></thead><tbody>';
            users.forEach(function(u) {
                var userStatus = u.online ? '在线' : '离线';
                var userColor = u.online ? '#4caf50' : '#999';
                if (u.status === 'banned') {
                    userStatus = '封禁';
                    userColor = '#f44336';
                }
                var statusBadge = '<span style="color:' + userColor + ';font-weight:600;font-size:13px;">● ' + userStatus + '</span>';
                var actionBtns = u.status === 'active'
                    ? '<button class="btn-sm btn-warning" onclick="showBanModal(' + u.id + ')">封禁</button>'
                    : '<button class="btn-sm" style="background:#4caf50;color:#fff;" onclick="unbanUser(' + u.id + ')">解封</button>';
                var banBtn = actionBtns + ' <button class="btn-sm btn-danger" onclick="forceDeleteUser(' + u.id + ')">注销</button>';
                var expiresAt = u.ban_expires_at ? formatDate(u.ban_expires_at) : '-';
                var reason = u.ban_reason ? escapeHtml(u.ban_reason) : '-';
                html += '<tr>' +
                    '<td>' + u.id + '</td>' +
                    '<td>' + escapeHtml(u.username) + '</td>' +
                    '<td>' + escapeHtml(u.email) + '</td>' +
                    '<td>' + statusBadge + '</td>' +
                    '<td style="font-size:12px;">' + expiresAt + '</td>' +
                    '<td style="font-size:12px;max-width:200px;word-break:break-word;">' + reason + '</td>' +
                    '<td>' + u.total_chats + '</td>' +
                    '<td>' + banBtn + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function showBanModal(userId) {
            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');

            var presetsHtml = '';
            for (var h in banPresets) {
                presetsHtml += '<button class="btn-sm" style="background:#e0e0e0;color:#333;" onclick="setBanDuration(' + h + ',\'' + banPresets[h] + '\')">' + banPresets[h] + '</button> ';
            }

            content.innerHTML = '' +
                '<h3>封禁用户 #' + userId + '</h3>' +
                '<div class="form-group"><label>封禁时长（小时）</label><input type="number" id="banDuration" min="1" placeholder="请输入小时数" required></div>' +
                '<div class="form-group"><label>快捷选择</label><div>' + presetsHtml + '</div></div>' +
                '<div class="form-group"><label>封禁理由（最多50字）</label><textarea id="banReason" rows="4" placeholder="请输入封禁理由" maxlength="50" required style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical;"></textarea></div>' +
                '<div class="modal-footer">' +
                '  <button class="btn-sm" style="background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-sm" style="background:var(--primary-gradient);color:#fff;" onclick="banUser(' + userId + ')">确认封禁</button>' +
                '</div>';
            modal.classList.add('show');
        }

        function setBanDuration(hours, label) {
            document.getElementById('banDuration').value = hours;
        }

        async function banUser(userId) {
            var duration = parseInt(document.getElementById('banDuration').value);
            var reason = document.getElementById('banReason').value.trim();

            if (!duration || duration <= 0) {
                showToast('请设置有效的封禁时长', 'error');
                return;
            }
            if (reason.length > 50) {
                showToast('封禁理由不能超过50字（当前' + reason.length + '字）', 'error');
                return;
            }

            try {
                var res = await api('POST', '/api/admin/ban', {
                    user_id: userId,
                    action: 'ban',
                    duration_hours: duration,
                    ban_reason: reason
                });
                if (res.code === 200) {
                    showToast('已封禁用户 #' + userId, 'success');
                    closeModal();
                    searchUsers();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) {
                showToast('操作失败', 'error');
            }
        }

        async function unbanUser(userId) {
            if (!confirm('确定要解封用户 #' + userId + ' 吗？')) return;
            try {
                var res = await api('POST', '/api/admin/ban', {
                    user_id: userId,
                    action: 'unban'
                });
                if (res.code === 200) {
                    showToast('已解封', 'success');
                    searchUsers();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) {
                showToast('操作失败', 'error');
            }
        }

        async function forceDeleteUser(userId) {
            if (!confirm('确定要强制注销用户 #' + userId + ' 吗？此操作不可恢复！')) return;
            try {
                var res = await api('POST', '/api/admin/delete-user', { user_id: userId });
                if (res.code === 200) {
                    showToast('用户已被强制注销', 'success');
                    searchUsers();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) {
                showToast('操作失败', 'error');
            }
        }

        function renderLogs() {
            var body = document.getElementById('contentBody');
            body.innerHTML = '' +
                '<div class="search-bar">' +
                '  <select id="logLevel"><option value="">全部级别</option><option value="info">INFO</option><option value="warn">WARN</option><option value="error">ERROR</option></select>' +
                '  <button onclick="loadLogs()">查询</button>' +
                '</div>' +
                '<div id="logsTable"></div>' +
                '<div id="logsPagination" class="pagination"></div>';
            loadLogs();
        }

        async function loadLogs(page) {
            page = page || currentPage;
            var level = document.getElementById('logLevel') ? document.getElementById('logLevel').value : '';
            var url = '/api/admin/logs?page=' + page + '&page_size=20';
            if (level) url += '&level=' + level;
            try {
                var res = await api('GET', url);
                if (res.code === 200) {
                    var container = document.getElementById('logsTable');
                    if (!res.data.logs || res.data.logs.length === 0) {
                        container.innerHTML = '<div class="empty-state"><p>暂无日志</p></div>';
                    } else {
                        var html = '<table class="data-table log-table"><thead><tr>' +
                            '<th>时间</th><th>级别</th><th>消息</th></tr></thead><tbody>';
                        var levelColors = { info:'#2196f3', warn:'#ff9800', error:'#f44336', critical:'#d32f2f', debug:'#9e9e9e', trace:'#9e9e9e' };
                        var bgColors = { info:'#e3f2fd', warn:'#fff3e0', error:'#ffebee', critical:'#ffcdd2', debug:'#f5f5f5', trace:'#f5f5f5' };
                        res.data.logs.forEach(function(l) {
                            var rawLevel = parseLogLevel(l.message) || 'info';
                            var rawTime = parseLogTime(l.message) || formatDate(l.created_at) || '-';
                            var color = levelColors[rawLevel] || '#333';
                            var bg = bgColors[rawLevel] || 'transparent';
                            html += '<tr style="background:' + bg + '">' +
                                '<td style="font-size:12px;white-space:nowrap;font-family:monospace;">' + escapeHtml(rawTime) + '</td>' +
                                '<td><span style="display:inline-block;padding:2px 8px;border-radius:4px;background:' + color + ';color:#fff;font-size:11px;font-weight:600;">' + rawLevel.toUpperCase() + '</span></td>' +
                                '<td style="font-size:12px;font-family:monospace;word-break:break-all;">' + escapeHtml(l.message) + '</td>' +
                                '</tr>';
                        });
                        html += '</tbody></table>';
                        container.innerHTML = html;
                    }
                    renderPagination('logsPagination', page, Math.ceil((res.data.total || 0) / 20), loadLogs);
                }
            } catch (e) {}
        }

        function renderPagination(containerId, current, total, callback) {
            var container = document.getElementById(containerId);
            if (total <= 1) { container.innerHTML = ''; return; }
            var html = '';
            for (var i = 1; i <= Math.min(total, 10); i++) {
                html += '<button class="' + (i === current ? 'active' : '') + '" onclick="' +
                    callback.name + '(' + i + ')">' + i + '</button>';
            }
            container.innerHTML = html;
        }

        function logout() {
            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');
            content.innerHTML = '' +
                '<h3>确认退出登录</h3>' +
                '<p style="color:#555;margin:16px 0;font-size:15px;">确定要退出当前账号吗？</p>' +
                '<div class="modal-footer" style="justify-content:center;">' +
                '  <button class="btn-sm" style="min-width:120px;background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-sm" style="min-width:120px;background:var(--primary-gradient);color:#fff;" onclick="confirmLogout()">确认退出</button>' +
                '</div>';
            modal.classList.add('show');
        }

        function confirmLogout() {
            closeModal();
            localStorage.clear();
            try { localStorage.setItem('logout', Date.now()); } catch(e) {}
            window.location.replace('/login.html');
        }

        window.addEventListener('storage', function(e) {
            if ((e.key === 'token' && !e.newValue) || e.key === 'logout') {
                localStorage.clear();
                window.location.href = '/login.html';
            }
        });

        startPeriodicAuthCheck(2000);

        var userRefreshTimer = null;

        function startUserAutoRefresh() {
            if (userRefreshTimer) clearInterval(userRefreshTimer);
            if (currentTab === 'users') {
                userRefreshTimer = setInterval(function() {
                    loadAllUsers(currentPage);
                }, 2000);
            }
        }

        function stopUserAutoRefresh() {
            if (userRefreshTimer) {
                clearInterval(userRefreshTimer);
                userRefreshTimer = null;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
