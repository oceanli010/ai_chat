<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>AI聊天室</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2 id="sidebarName">AI 聊天室</h2>
                <div class="user-id" id="sidebarInfo"></div>
            </div>
            <nav class="sidebar-nav">
                <a class="active" onclick="switchTab('chat')" id="navChat">
                    <span class="icon">💬</span> AI 聊天
                </a>
                <a onclick="switchTab('profile')" id="navProfile">
                    <span class="icon">👤</span> 个人中心
                </a>
            </nav>
            <div class="sidebar-footer">
                <a onclick="logout()">🚪 退出登录</a>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <h3 id="contentTitle">AI 聊天</h3>
            </div>
            <div class="content-body" id="contentBody"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        var currentTab = 'chat';
        var currentUser = null;
        var messages = [];
        var profileLoaded = false;

        setupGlobalLogout();
        startPeriodicAuthCheck(30000);

        checkAuth();

        function checkAuth() {
            if (!localStorage.getItem('token')) {
                window.location.href = '/login.html';
                return;
            }
            loadUserInfo();
        }

        async function loadUserInfo() {
            var body = document.getElementById('contentBody');
            body.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>加载中...</p></div>';
            try {
                var res = await api('GET', '/api/user/profile');
                if (res.code === 200) {
                    currentUser = res.data;
                    profileLoaded = true;
                    document.getElementById('sidebarName').textContent = res.data.username || res.data.nickname;
                    document.getElementById('sidebarInfo').textContent = 'ID: ' + res.data.id;
                    connectNotificationWS();
                } else {
                    body.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>加载失败：' + escapeHtml(res.message) + '</p><button class="btn-primary" onclick="location.reload()" style="width:auto;margin-top:12px;">重新加载</button></div>';
                    return;
                }
            } catch (e) {
                body.innerHTML = '<div class="empty-state"><div class="icon">📡</div><p>网络异常，请检查网络连接后重试</p><button class="btn-primary" onclick="location.reload()" style="width:auto;margin-top:12px;">重新加载</button></div>';
                return;
            }
            renderCurrentTab();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            document.getElementById('contentTitle').textContent = tab === 'chat' ? 'AI 聊天' : '个人中心';
            renderCurrentTab();
        }

        function renderCurrentTab() {
            if (currentTab === 'chat') renderChat();
            else renderProfile();
        }

        function renderChat() {
            var body = document.getElementById('contentBody');
            body.innerHTML = '' +
                '<div class="chat-area">' +
                '  <div class="chat-messages" id="chatMessages">' +
                '    <div class="empty-state"><div class="icon">⏳</div><p>加载聊天记录...</p></div>' +
                '  </div>' +
                '  <div class="chat-input-area">' +
                '    <textarea id="chatInput" placeholder="输入消息，与AI对话..." rows="1"></textarea>' +
                '    <button id="sendBtn" onclick="sendChatMessage()">发送</button>' +
                '    <button class="btn-sm btn-warning" style="align-self:flex-end;margin-bottom:0;" onclick="clearChat()">清除记录</button>' +
                '  </div>' +
                '</div>';
            loadHistory();
            document.getElementById('chatInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });
        }

        function renderProfile() {
            if (!profileLoaded) {
                loadUserInfo();
                return;
            }
            if (!currentUser) {
                document.getElementById('contentBody').innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>无法加载用户信息</p></div>';
                return;
            }
            var body = document.getElementById('contentBody');
            body.innerHTML = '' +
                '<div class="profile-section">' +
                '  <h4>基本信息</h4>' +
                '  <div class="info-row"><span class="label">用户ID</span><span class="value">' + currentUser.id + '</span></div>' +
                '  <div class="info-row"><span class="label">用户名</span><span class="value">' + escapeHtml(currentUser.username) + '</span></div>' +
                '  <div class="info-row"><span class="label">邮箱</span><span class="value">' + escapeHtml(currentUser.email) + '</span></div>' +
                '  <div class="info-row"><span class="label">累计对话</span><span class="value">' + (currentUser.total_chats || 0) + ' 次</span></div>' +
                '  <div class="info-row"><span class="label">注册时间</span><span class="value">' + formatDate(currentUser.created_at) + '</span></div>' +
                '  <div style="margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;">' +
                '    <button class="btn-primary" style="width:auto;" onclick="showUpdateUsername()">修改用户名</button>' +
                '    <button class="btn-primary" style="width:auto;" onclick="showChangePassword()">修改密码</button>' +
                '    <button class="btn-primary" style="width:auto;background:var(--danger);background-image:none;" onclick="deleteAccount()">注销账号</button>' +
                '  </div>' +
                '</div>';
        }

        async function loadHistory() {
            try {
                var res = await api('GET', '/api/chat/history?page_size=200');
                if (res.code === 200) {
                    messages = res.data.messages || [];
                    renderMessages();
                } else {
                    var container = document.getElementById('chatMessages');
                    if (container) container.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>加载失败：' + escapeHtml(res.message) + '</p></div>';
                }
            } catch (e) {
                var container = document.getElementById('chatMessages');
                if (container) container.innerHTML = '<div class="empty-state"><div class="icon">📡</div><p>网络异常，无法加载聊天记录</p></div>';
            }
        }

        function renderMessages() {
            var container = document.getElementById('chatMessages');
            if (!container) return;
            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>开始与AI聊天吧</p></div>';
                return;
            }
            container.innerHTML = messages.map(function(m) {
                var cls = m.role === 'user' ? 'user' : 'assistant';
                return '<div class="message ' + cls + '">' +
                    '<div>' + escapeHtml(m.content).replace(/\n/g, '<br>') + '</div>' +
                    '<div class="message-time">' + formatDate(m.created_at) + '</div>' +
                    '</div>';
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        var isSending = false;

        async function sendChatMessage() {
            var input = document.getElementById('chatInput');
            var content = input.value.trim();
            if (!content || isSending) return;

            var sendBtn = document.getElementById('sendBtn');

            isSending = true;
            sendBtn.disabled = true;
            input.disabled = true;
            sendBtn.textContent = '发送中...';

            var now = new Date().toISOString().slice(0, 19).replace('T', ' ');
            messages.push({ role: 'user', content: content, created_at: now });
            renderMessages();

            var loadingIdx = messages.length;
            messages.push({ role: 'assistant', content: '⏳ AI思考中...', created_at: now });
            renderMessages();

            var maxRetries = 2;
            var retryDelay = 1000;
            var lastError = '';

            for (var attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    var res = await api('POST', '/api/chat/send', { content: content });

                    if (res.code === 200) {
                        input.value = '';
                        messages[loadingIdx] = { role: 'assistant', content: '✅ 消息已发送', created_at: now };

                        if (res.data && res.data.reply) {
                            messages[loadingIdx] = { role: 'assistant', content: res.data.reply, created_at: now };
                        }
                        renderMessages();
                        isSending = false;
                        sendBtn.textContent = '发送';
                        sendBtn.disabled = false;
                        input.disabled = false;
                        input.focus();
                        return;
                    } else {
                        lastError = res.message;
                    }
                } catch (err) {
                    lastError = '网络请求失败';
                }

                if (attempt < maxRetries) {
                    messages[loadingIdx] = { role: 'assistant', content: '⏳ 发送失败，' + (maxRetries - attempt) + '秒后重试...', created_at: now };
                    renderMessages();
                    await new Promise(r => setTimeout(r, retryDelay * (attempt + 1)));
                }
            }

            messages[loadingIdx] = { role: 'assistant', content: '❌ ' + lastError + '\n可点击重发或复制消息重试', created_at: now };
            renderMessages();

            isSending = false;
            sendBtn.textContent = '发送';
            sendBtn.disabled = false;
            input.disabled = false;
        }

        async function clearChat() {
            if (!confirm('确定要清除所有聊天记录吗？此操作不可恢复。')) return;

            try {
                var res = await api('DELETE', '/api/chat/clear');
                if (res.code === 200) {
                    messages = [];
                    renderMessages();
                    showToast('聊天记录已清除', 'success');
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) {
                showToast('操作失败', 'error');
            }
        }

        function showUpdateUsername() {
            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');
            content.innerHTML = '' +
                '<h3>修改用户名</h3>' +
                '<div class="form-group"><label>新用户名</label><input type="text" id="editUsername" placeholder="输入新用户名" value="' + escapeHtml(currentUser.username) + '"></div>' +
                '<div class="modal-footer">' +
                '  <button class="btn-sm" style="background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-sm" style="background:var(--primary-gradient);color:#fff;" onclick="updateProfile()">保存</button>' +
                '</div>';
            modal.classList.add('show');
        }

        function showChangePassword() {
            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');
            content.innerHTML = '' +
                '<h3>修改密码</h3>' +
                '<div class="form-group"><label>旧密码</label><input type="password" id="oldPass" placeholder="请输入当前密码"></div>' +
                '<div class="form-group"><label>新密码</label><input type="password" id="newPass" placeholder="6-128位新密码"></div>' +
                '<div class="form-group"><label>确认新密码</label><input type="password" id="confirmPass" placeholder="请再次输入新密码"></div>' +
                '<div class="modal-footer">' +
                '  <button class="btn-sm" style="background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-sm" style="background:var(--primary-gradient);color:#fff;" onclick="changePassword()">保存</button>' +
                '</div>';
            modal.classList.add('show');
        }

        async function updateProfile() {
            var username = document.getElementById('editUsername').value.trim();
            if (!username) { showToast('请输入新用户名', 'warning'); return; }
            try {
                var res = await api('PUT', '/api/user/profile', { username: username, nickname: '' });
                if (res.code === 200) {
                    showToast('修改成功', 'success');
                    closeModal();
                    profileLoaded = false;
                    loadUserInfo();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) { showToast('操作失败', 'error'); }
        }

        async function changePassword() {
            var oldPw = document.getElementById('oldPass').value;
            var newPw = document.getElementById('newPass').value;
            var confirmPw = document.getElementById('confirmPass').value;
            if (!oldPw || !newPw) { showToast('请填写所有字段', 'warning'); return; }
            if (newPw !== confirmPw) { showToast('两次输入的密码不一致', 'error'); return; }
            if (newPw.length < 6) { showToast('密码至少6位', 'error'); return; }
            try {
                var res = await api('PUT', '/api/user/password', { old_password: oldPw, new_password: newPw });
                if (res.code === 200) {
                    showToast('密码修改成功', 'success');
                    closeModal();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) { showToast('操作失败', 'error'); }
        }

        async function deleteAccount() {
            if (!currentUser || !currentUser.email) {
                showToast('无法获取用户信息', 'error');
                return;
            }

            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');
            content.innerHTML = '' +
                '<h3 style="color:#f44336;">⚠️ 账号注销</h3>' +
                '<div style="background:#fff3e0;border-radius:8px;padding:16px;margin:12px 0;font-size:13px;line-height:1.8;">' +
                '<p style="font-weight:600;margin-bottom:8px;">注销流程说明：</p>' +
                '<p><strong>步骤一：</strong>邮箱验证 → 输入注册邮箱的验证码确认身份</p>' +
                '<p><strong>步骤二：</strong>进入 24 小时冷静期 → 账号暂时不可登录</p>' +
                '<p><strong>步骤三：</strong>冷静期结束 → 账号和数据被永久删除，不可恢复</p>' +
                '<p style="margin-top:8px;color:#e65100;">💡 冷静期内可登录取消注销，取消后 72 小时内无法再次申请注销</p>' +
                '</div>' +
                '<p style="color:#555;margin:12px 0;font-size:14px;line-height:1.8;">' +
                '确定要提交注销申请吗？</p>' +
                '<div class="modal-footer" style="justify-content:center;">' +
                '  <button class="btn-sm" style="min-width:120px;background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-danger btn-sm" onclick="continueDeleteAccount()">确认注销</button>' +
                '</div>';
            modal.classList.add('show');
        }

        async function continueDeleteAccount() {
            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');
            content.innerHTML = '' +
                '<h3 style="color:#f44336;">📧 邮箱验证</h3>' +
                '<p style="color:#555;margin:12px 0;font-size:14px;line-height:1.8;">' +
                '请输入注册邮箱 <strong>' + escapeHtml(currentUser.email) + '</strong> 的验证码完成注销。</p>' +
                '<div class="form-group">' +
                '  <label>邮箱验证码</label>' +
                '  <div class="form-row">' +
                '    <input type="text" id="deleteCode" placeholder="请输入6位验证码" maxlength="6" style="flex:1;">' +
                '    <button type="button" class="btn-send-code" id="sendDeleteCodeBtn" onclick="sendDeleteCode()">发送验证码</button>' +
                '  </div>' +
                '</div>' +
                '<div class="modal-footer">' +
                '  <button class="btn-sm" style="min-width:120px;background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-sm" style="min-width:120px;background:var(--danger);color:#fff;" onclick="confirmDeleteAccount()">确认注销</button>' +
                '</div>';
            modal.classList.add('show');
        }

        var deleteCodeCooldown = 0;

        async function sendDeleteCode() {
            if (deleteCodeCooldown > 0) return;
            var btn = document.getElementById('sendDeleteCodeBtn');
            if (btn) btn.disabled = true;
            try {
                var res = await api('POST', '/api/auth/send-delete-code', {});
                if (res.code === 200) {
                    showToast('验证码已重新发送', 'success');
                    deleteCodeCooldown = 60;
                    var timer = setInterval(function() {
                        var b = document.getElementById('sendDeleteCodeBtn');
                        if (deleteCodeCooldown > 0) {
                            if (b) b.textContent = deleteCodeCooldown + 's';
                            deleteCodeCooldown--;
                        } else {
                            if (b) { b.textContent = '重新发送'; b.disabled = false; }
                            clearInterval(timer);
                        }
                    }, 1000);
                } else {
                    showToast(res.message, 'error');
                    if (btn) btn.disabled = false;
                }
            } catch (e) {
                showToast('网络错误', 'error');
                if (btn) btn.disabled = false;
            }
        }

        async function confirmDeleteAccount() {
            var code = document.getElementById('deleteCode').value.trim();
            if (!code || code.length !== 6) {
                showToast('请输入6位验证码', 'warning');
                return;
            }
            try {
                var res = await api('DELETE', '/api/user/account', { code: code });
                if (res.code === 200) {
                    showToast('账号已注销', 'success');
                    setTimeout(function() {
                        localStorage.clear();
                        try { localStorage.setItem('logout', Date.now()); } catch(e) {}
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (e) { showToast('操作失败', 'error'); }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function logout() {
            var modal = document.getElementById('modal');
            var content = document.getElementById('modalContent');
            content.innerHTML = '' +
                '<h3>确认退出登录</h3>' +
                '<p style="color:#555;margin:16px 0;font-size:15px;">确定要退出当前账号吗？</p>' +
                '<div class="modal-footer" style="justify-content:center;">' +
                '  <button class="btn-sm" style="min-width:120px;background:#ccc;color:#333;" onclick="closeModal()">取消</button>' +
                '  <button class="btn-sm" style="min-width:120px;background:var(--primary-gradient);color:#fff;" onclick="confirmLogout()">确认退出</button>' +
                '</div>';
            modal.classList.add('show');
        }

        function confirmLogout() {
            closeModal();
            disconnectNotificationWS();
            localStorage.clear();
            try { localStorage.setItem('logout', Date.now()); } catch(e) {}
            window.location.replace('/login.html');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        window.addEventListener('offline', function() {
            showToast('网络已断开，部分功能不可用', 'warning');
        });
    </script>
</body>
</html>
