<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天室 - 重置密码</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <h1>重置密码</h1>
            <p class="subtitle">通过邮箱验证码重置你的密码</p>
        <form id="resetForm">
            <div class="form-group">
                <label>邮箱</label>
                <div class="form-row">
                    <input type="email" id="email" placeholder="请输入注册邮箱" required autocomplete="email" autofocus inputmode="email">
                    <button type="button" class="btn-send-code" id="sendCodeBtn" onclick="sendVerifyCode()">发送验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <input type="text" id="code" placeholder="请输入6位验证码" required maxlength="6" inputmode="numeric" pattern="[0-9]*">
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="new_password" placeholder="6-128位新密码" required minlength="6" maxlength="128">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirm_password" placeholder="请再次输入新密码" required>
            </div>
            <button type="submit" class="btn-primary">重置密码</button>
        </form>
        <div class="links">
            <a href="/login.html">返回登录</a>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        var sendCooldown = 0;

        async function sendVerifyCode() {
            if (sendCooldown > 0) return;
            var email = document.getElementById('email').value.trim();
            if (!email) { showToast('请先输入邮箱地址', 'warning'); return; }

            var btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;

            try {
                var res = await api('POST', '/api/auth/send-code', {
                    email: email,
                    type: 'reset_password'
                });
                if (res.code === 200) {
                    showToast('验证码已发送，请检查邮箱', 'success');
                    sendCooldown = 60;
                    countdown();
                } else {
                    showToast(res.message, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('网络错误', 'error');
                btn.disabled = false;
            }
        }

        function countdown() {
            var btn = document.getElementById('sendCodeBtn');
            if (sendCooldown > 0) {
                btn.textContent = sendCooldown + 's 后重新发送';
                sendCooldown--;
                setTimeout(countdown, 1000);
            } else {
                btn.textContent = '发送验证码';
                btn.disabled = false;
            }
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var code = document.getElementById('code').value.trim();
            var newPassword = document.getElementById('new_password').value;
            var confirmPassword = document.getElementById('confirm_password').value;

            if (!email || !code || !newPassword) {
                showToast('请填写所有字段', 'warning');
                return;
            }
            if (newPassword !== confirmPassword) {
                showToast('两次输入的密码不一致', 'error');
                return;
            }
            if (newPassword.length < 6) {
                showToast('密码至少需要6位', 'error');
                return;
            }

            try {
                var res = await api('POST', '/api/auth/reset-password', {
                    email: email,
                    code: code,
                    new_password: newPassword
                });
                if (res.code === 200) {
                    showToast('密码重置成功！即将跳转到登录页', 'success');
                    setTimeout(() => { window.location.href = '/login.html'; }, 1500);
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showToast('网络错误', 'error');
            }
        });
    </script>

    <footer class="auth-footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2024XXXXXX号-1</a>
        <span class="footer-sep">|</span>
        <span>© 2026 AI Chat Room</span>
    </footer>
</body>
</html>
